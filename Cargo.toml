[workspace]
resolver = "2"
members = ["crates/foliopdf", "crates/foliopdf-wasm", "crates/foliopdf-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Keith Adler <keith.adler@icloud.com>"]
repository = "https://github.com/keithadler/foliopdf"
homepage = "https://github.com/keithadler/foliopdf"
keywords = ["pdf", "wasm", "merge", "encrypt", "compress"]
categories = ["parser-implementations", "encoding", "wasm"]

[workspace.dependencies]
foliopdf = { path = "crates/foliopdf", version = "0.2.0" }
miniz_oxide = "0.8"
md-5 = "0.10"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
