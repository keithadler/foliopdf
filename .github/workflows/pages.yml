name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: ./scripts/build-wasm.sh
      - run: ./scripts/fetch-vendor.sh
      - name: Assemble site
        run: |
          mkdir -p site/pkg site/vendor
          cp examples/web/index.html examples/web/*.js site/
          cp -r examples/web/vendor/. site/vendor/
          # Cache-bust module imports so a new deploy is picked up immediately.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" site/index.html site/*.js
          cp pkg/foliopdf.js pkg/foliopdf_bg.wasm site/pkg/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
